[project]
name = "khat"
version = "1.0.0"
description = "KHAT: a Korean benchmark for long-context and retrieval-augmented question answering over housing announcements and public tables."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ruo Lee" }, { name = "Taeyeon Oh" }]
dependencies = ["numpy>=1.26", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
build = ["requests>=2.32", "tiktoken==0.13.0", "pymupdf==1.27.2.3", "olefile==0.47", "beautifulsoup4>=4.12", "lxml>=5.0"]
dense = ["numpy>=1.26", "sentence-transformers>=3.0"]
runs = ["openai>=1.0.0", "anthropic>=0.40.0"]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khat"]
